name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: python scripts/run_python_tests.py

  # The APK ships the Python 3.11 runtime (the newest Chaquopy supports for 32-bit ARM),
  # so the app's own modules are exercised on that interpreter as well. The upstream
  # h2 suite stays on 3.13 above: its idle/retry windows are patched down to 5-10 ms and
  # one assertion depends on runner speed and test order, which a slow shared runner breaks.
  python-tests-311:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: python -m pytest tests -q
        env:
          PYTHONPATH: upstream/flowseal:app/src/main/python

  android:
    runs-on: ubuntu-24.04
    needs: [python-tests, python-tests-311]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The runner already ships the Android SDK. Accept licenses and install only
      # the packages this project needs. No third-party setup action is used.
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Flowseal core is unmodified except the documented AES patch
        run: python scripts/sync_upstream.py --check
      # Chaquopy runs pip with a host interpreter of the target version; point it at the
      # Python 3.11 installed above so the 32-bit (armeabi-v7a) runtime can be built.
      - name: JVM unit tests
        run: chmod +x gradlew && ./gradlew -PbuildPython="$(python -c 'import sys; print(sys.executable)')" :app:testDebugUnitTest
      - name: Build debug APK (signed automatically, installable)
        run: ./gradlew -PbuildPython="$(python -c 'import sys; print(sys.executable)')" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tg-pulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
