name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: python scripts/run_python_tests.py

  android:
    runs-on: ubuntu-24.04
    needs: python-tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The runner already ships the Android SDK. Accept licenses and install only
      # the packages this project needs. No third-party setup action is used.
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Flowseal core is unmodified except the documented AES patch
        run: python scripts/sync_upstream.py --check
      - name: JVM unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest
      - name: Build debug APK (signed automatically, installable)
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tg-pulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
