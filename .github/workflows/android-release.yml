name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: python scripts/run_python_tests.py

  android:
    runs-on: ubuntu-24.04
    needs: python-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Flowseal core is unmodified except the documented AES patch
        run: python scripts/sync_upstream.py --check
      - name: JVM unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest
      - name: Build debug APK (signed automatically, installable)
        run: chmod +x gradlew && ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tg-pulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
